name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # 真宿主测试工件：tests/hostconformance 依赖它 spawn 真宿主
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install test-host artifact
        run: npm install --no-audit --no-fund

      - name: Test
        run: go test ./...
